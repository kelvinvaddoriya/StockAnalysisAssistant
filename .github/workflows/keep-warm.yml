# Keeps the Render free-tier backend from spinning down.
#
# Free instances sleep after ~15 minutes idle, and the next request pays a
# 30-60s cold start (measured: 62s) while the user watches a loading animation.
# A 10-minute ping keeps the instance up.
#
# Worth knowing:
#   - Free instances get 750 hours/month and always-on is ~730, so this uses
#     nearly the whole allowance. Adding a second free service would exceed it.
#   - GitHub disables scheduled workflows after 60 days with no repo activity.
#   - GitHub's cron is best-effort and can run late under load, so this reduces
#     cold starts rather than eliminating them.
name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Same origin as the CSP connect-src in frontend/vercel.json — change both.
      - name: Ping /api/health
        run: >
          curl --fail --silent --show-error
          --max-time 150 --retry 2 --retry-delay 30
          https://bourse-backend-8bbv.onrender.com/api/health
